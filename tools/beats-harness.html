<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%2316130f'/%3E%3C/svg%3E"
    />
    <title>长段落分三段 · SceneBeats 验证页 · 把名字留下来</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #16130f;
        --paper: #ede6d8;
        --paper-dim: #bdb3a2;
        --red: #a32b2b;
        --rust: #7a3e2e;
        --gold: #c8a063;
        --line: rgba(237, 230, 216, 0.16);
        --serif: 'Source Han Serif SC', 'Noto Serif SC', 'Songti SC', 'SimSun', 'STSong', serif;
        --sans: 'Source Han Sans SC', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--ink);
        color: var(--paper);
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.7;
      }

      .harness {
        max-width: 1080px;
        margin: 0 auto;
        padding: 26px 20px 72px;
        display: flex;
        flex-direction: column;
        gap: 30px;
      }

      .harness__head {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 14px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--line);
      }

      .harness__kicker {
        margin: 0 0 2px;
        font-size: 11px;
        letter-spacing: 0.16em;
        color: rgba(237, 230, 216, 0.45);
      }

      .harness__title {
        margin: 0;
        font-family: var(--serif);
        font-size: 24px;
        font-weight: 400;
        letter-spacing: 0.1em;
      }

      .harness__controls {
        display: flex;
        align-items: flex-end;
        gap: 14px;
      }

      .harness__field {
        display: flex;
        flex-direction: column;
        gap: 3px;
        font-size: 10px;
        letter-spacing: 0.14em;
        color: rgba(237, 230, 216, 0.42);
      }

      .harness__field select,
      .harness__field input {
        font-family: var(--sans);
        font-size: 12px;
        padding: 4px 6px;
        color: var(--paper);
        background: rgba(237, 230, 216, 0.05);
        border: 1px solid rgba(237, 230, 216, 0.18);
        border-radius: 1px;
      }

      .harness__panel {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .harness__panelHead {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
      }

      .harness__panelHead h2 {
        margin: 0;
        font-family: var(--serif);
        font-size: 15px;
        font-weight: 400;
        letter-spacing: 0.14em;
        color: rgba(237, 230, 216, 0.82);
      }

      .harness__stats {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 14px;
        font-size: 11px;
        letter-spacing: 0.06em;
        color: rgba(237, 230, 216, 0.42);
      }

      .harness__stats b {
        margin-left: 5px;
        font-family: var(--serif);
        font-weight: 400;
        color: var(--gold);
        font-variant-numeric: tabular-nums;
      }

      .harness__stats button {
        padding: 3px 9px;
        font: inherit;
        color: rgba(237, 230, 216, 0.72);
        background: none;
        border: 1px solid rgba(237, 230, 216, 0.2);
        border-radius: 1px;
        cursor: pointer;
      }

      .harness__stats button:hover {
        border-color: rgba(200, 160, 99, 0.7);
        color: var(--paper);
      }

      /* ---- 模拟 App 的 Stage 层：只有它换整页背景，组件自己不碰 ---- */

      .stageMock {
        position: relative;
        padding: clamp(18px, 4vw, 46px);
        border: 1px solid rgba(237, 230, 216, 0.1);
        border-radius: 2px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        transition: background 640ms var(--ease);
        overflow: hidden;
      }

      .stageMock::before {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          repeating-linear-gradient(0deg, rgba(237, 230, 216, 0.02) 0 1px, transparent 1px 4px),
          radial-gradient(70% 50% at 50% 120%, rgba(0, 0, 0, 0.55), transparent 70%);
        opacity: 0.7;
      }

      .stageMock[data-mood='scene'] {
        background:
          radial-gradient(110% 80% at 50% 0%, rgba(58, 68, 78, 0.55), transparent 62%),
          linear-gradient(180deg, #121821, #0b0e13);
      }

      .stageMock[data-mood='memory'] {
        background:
          radial-gradient(120% 90% at 50% 4%, rgba(122, 62, 46, 0.62), transparent 64%),
          linear-gradient(180deg, #2a1c13, #150e09);
      }

      .stageMock[data-mood='figure-male'],
      .stageMock[data-mood='figure-female'] {
        background:
          radial-gradient(110% 80% at 42% 0%, rgba(122, 62, 46, 0.46), transparent 58%),
          radial-gradient(80% 60% at 78% 96%, rgba(163, 43, 43, 0.22), transparent 68%),
          linear-gradient(180deg, #1b1712, #0d0a08);
      }

      .stageMock__label {
        position: relative;
        margin: 0;
        align-self: flex-start;
        font-size: 11px;
        letter-spacing: 0.1em;
        color: rgba(237, 230, 216, 0.5);
      }

      .stageMock__label b {
        font-family: var(--serif);
        font-weight: 400;
        color: var(--gold);
      }

      .stageMock > .beats {
        position: relative;
      }

      /* ---- 模拟 App 的 .scene 卡片（用来验证 beats--flat 嵌进去的样子） ---- */

      .sceneMock {
        position: relative;
        width: min(760px, 100%);
        margin: 0 auto;
        padding: clamp(20px, 4vw, 44px) clamp(20px, 4vw, 48px);
        background: rgba(22, 19, 15, 0.78);
        border: 1px solid var(--line);
        border-radius: 2px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      }

      .sceneMock__title {
        margin: 0 0 4px;
        font-family: var(--serif);
        font-weight: 600;
        font-size: clamp(22px, 3vw, 30px);
        letter-spacing: 0.06em;
      }

      .sceneMock__meta {
        margin: 0 0 22px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        letter-spacing: 0.16em;
        color: var(--paper-dim);
      }

      /* ---- 假选项区（App 的 footer） ---- */
      .fakeChoices {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .fakeChoice {
        text-align: left;
        padding: 13px 16px;
        font-family: var(--sans);
        font-size: 15px;
        color: var(--paper);
        background: rgba(237, 230, 216, 0.045);
        border: 1px solid var(--line);
        border-radius: 2px;
        cursor: pointer;
      }

      .fakeChoice:hover {
        border-color: rgba(200, 160, 99, 0.6);
      }

      .fakeNote {
        margin: 0;
        font-size: 11px;
        letter-spacing: 0.06em;
        color: rgba(237, 230, 216, 0.34);
      }

      /* ---- 样例网格 / 分组矩阵 ---- */

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 16px;
      }

      .cell {
        padding: 12px;
        border: 1px solid rgba(237, 230, 216, 0.1);
        border-radius: 2px;
        background: rgba(237, 230, 216, 0.02);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .cell__head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        font-size: 11px;
        letter-spacing: 0.08em;
        color: rgba(237, 230, 216, 0.45);
      }

      .cell__head b {
        font-family: var(--serif);
        font-weight: 400;
        color: var(--gold);
      }

      /* 矩阵里的卡片压小一点，四个并排也能看清分组 */
      .cell--matrix .beats {
        padding: 14px 14px;
        font-size: 13px;
        line-height: 1.6;
        box-shadow: none;
        backdrop-filter: none;
      }

      .cell--matrix .beats__para {
        margin-bottom: 6px;
      }

      /* 矩阵里是「7·一」这种占位段落，首字下沉会把数字放大，关掉更好读 */
      .cell--matrix .beats[data-beat-index='0'] .beats__beat--current .beats__para:first-child::first-letter {
        float: none;
        padding: 0;
        font-family: inherit;
        font-size: inherit;
        color: inherit;
      }

      .cell--matrix .beats__bar {
        margin-top: 12px;
        padding-top: 8px;
        position: static;
      }

      .cell--matrix .beats__next {
        padding: 5px 12px;
        font-size: 12px;
      }

      .cell--matrix .beats__figure {
        display: none;
      }

      .harness__foot {
        padding-top: 16px;
        border-top: 1px solid rgba(237, 230, 216, 0.1);
        font-size: 11px;
        letter-spacing: 0.06em;
        line-height: 2;
        color: rgba(237, 230, 216, 0.32);
      }

      .harness__foot code {
        font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
        color: rgba(200, 160, 99, 0.8);
      }

      @media (max-width: 640px) {
        .harness {
          padding: 16px 10px 48px;
          gap: 22px;
        }

        .harness__title {
          font-size: 19px;
        }

        .harness__head {
          flex-direction: column;
          align-items: flex-start;
        }

        .stageMock {
          padding: 14px 8px;
        }

        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
    <script type="module" src="./beats-harness.tsx"></script>
  </head>
  <body>
    <div id="harness-root"></div>
  </body>
</html>
